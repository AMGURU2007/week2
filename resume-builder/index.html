<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Builder</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#dce2eb;--accent:#315efb;--paper:#fff;--bg:#f3f5f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,Arial,sans-serif}.top{background:#111a2e;color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top strong{font-size:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.filebtn,select{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:hover,.filebtn:hover{filter:brightness(.96)}.layout{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:22px;padding:22px;max-width:1500px;margin:auto}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;height:max-content}.panel h2{font-size:16px;margin:0 0 14px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-weight:650;font-size:12px;color:#465166}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}.field textarea{min-height:66px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section-editor{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}.section-editor summary{font-weight:700;cursor:pointer}.hint{color:var(--muted);font-size:12px}.preview-wrap{min-width:0}.preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}.paper{background:var(--paper);width:210mm;min-height:297mm;max-width:100%;margin:auto;padding:18mm 17mm;box-shadow:0 8px 30px #18233a18;overflow-wrap:anywhere}.resume-header h1{font-size:30px;line-height:1.1;margin:0 0 7px}.resume-header p{margin:3px 0;color:var(--muted)}.resume-section{margin-top:22px;break-inside:avoid}.resume-section h2{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;border-bottom:2px solid var(--accent);padding-bottom:5px;margin:0 0 10px}.entry{margin:0 0 12px;break-inside:avoid}.entry strong{font-size:14px}.entry .meta{color:var(--muted);font-size:12px}.entry p{margin:4px 0;white-space:pre-line}.skills{display:flex;flex-wrap:wrap;gap:6px}.skills span{background:#eef2ff;padding:4px 8px;border-radius:20px;font-size:12px}.template-modern .resume-header{border-left:5px solid var(--accent);padding:4px 0 4px 15px}.template-classic .resume-header{text-align:center;border-bottom:2px solid #202938;padding-bottom:15px}.template-classic .resume-section h2{border-color:#222}.template-minimal{font-family:Georgia,serif}.template-minimal .resume-section h2{border:0;border-bottom:1px solid #888;letter-spacing:2px}.template-minimal .resume-header h1{font-weight:500}.drag-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.drag-chip{background:#f1f4fa;border:1px solid var(--line);border-radius:7px;padding:6px 8px;cursor:grab;font-size:12px}.drag-chip.dragging{opacity:.4}.status{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}.paper{width:100%;min-height:unset;padding:28px}.panel{order:1}}@media print{@page{size:A4;margin:0}body{background:white}.top,.panel,.preview-head{display:none!important}.layout{display:block;padding:0;margin:0}.preview-wrap{margin:0}.paper{width:210mm;min-height:297mm;max-width:none;margin:0;padding:18mm 17mm;box-shadow:none}.resume-section{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head>
<body>
<header class="top"><strong>▣ Resume Builder <span style="font-weight:400;color:#aab6d0">· offline</span></strong><div class="actions"><button id="saveBtn">Save data</button><label class="filebtn" for="loadFile">Load data</label><input id="loadFile" type="file" accept=".json,application/json" hidden><button class="primary" id="pdfBtn">Export PDF</button></div></header>
<main class="layout"><aside class="panel"><h2>Your details</h2>
<div class="field"><label>Full name</label><input id="name" value="Riya Sharma" placeholder="Your name"></div>
<div class="two"><div class="field"><label>Email</label><input id="email" value="riya@example.com"></div><div class="field"><label>Phone</label><input id="phone" value="+91 98765 43210"></div></div>
<div class="two"><div class="field"><label>Location</label><input id="location" value="Coimbatore, India"></div><div class="field"><label>LinkedIn / Website</label><input id="links" value="linkedin.com/in/riya"></div></div>
<div class="field"><label>Professional summary</label><textarea id="summary">Computer science student interested in building useful software and learning modern technologies.</textarea></div>
<div class="field"><label>Template</label><select id="template"><option value="modern">Modern</option><option value="classic">Classic</option><option value="minimal">Minimal</option></select></div>
<h2 style="margin-top:22px">Section order</h2><p class="hint">Drag the chips to reorder sections in the preview.</p><div class="drag-list" id="orderList"></div>
<div id="editors"></div><p class="status" id="status">Changes update the preview automatically. Data stays in this browser until you export it.</p></aside>
<section class="preview-wrap"><div class="preview-head"><strong>Live A4 preview</strong><span class="hint">Use Export PDF → Save as PDF</span></div><article class="paper template-modern" id="paper"><header class="resume-header"><h1 id="p-name"></h1><p id="p-contact"></p><p id="p-links"></p></header><section class="resume-section" id="summaryBlock"><h2>Profile</h2><p id="p-summary"></p></section><div id="resumeSections"></div></article></section></main>
<script>
const $=id=>document.getElementById(id);
const fields=['name','email','phone','location','links','summary'];
const defaultData={name:'Riya Sharma',email:'riya@example.com',phone:'+91 98765 43210',location:'Coimbatore, India',links:'linkedin.com/in/riya',summary:'Computer science student interested in building useful software and learning modern technologies.',template:'modern',order:['experience','projects','education','skills'],sections:{experience:[{title:'Software Development Intern',meta:'ABC Technologies · May 2026 – July 2026',desc:'Worked with a small team to build and test web application features.\nImproved usability and documented key workflows.'}],projects:[{title:'Resume Builder',meta:'HTML, CSS, JavaScript',desc:'Created an offline resume builder with live preview, templates and JSON save/load.'},{title:'Student Task Tracker',meta:'JavaScript · Personal project',desc:'Built a simple task manager with local browser storage.'}],education:[{title:'B.Sc. Computer Science',meta:'KG College of Arts and Science · 2025 – Present',desc:'Relevant coursework: Programming, Data Structures, Database Systems.'}],skills:[{title:'',meta:'',desc:'JavaScript, Python, Java, HTML, CSS, SQL, Git, Problem Solving'}]}};
let data=structuredClone(defaultData);const titles={experience:'Experience',projects:'Projects',education:'Education',skills:'Skills'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){fields.forEach(k=>{if($(k).value!==String(data[k]??''))$(k).value=data[k]??''});$('template').value=data.template;$('paper').className='paper template-'+data.template;$('p-name').textContent=data.name||'Your Name';$('p-contact').textContent=[data.email,data.phone,data.location].filter(Boolean).join('  ·  ');$('p-links').textContent=data.links||'';$('p-summary').textContent=data.summary||'';
$('resumeSections').innerHTML=data.order.map(key=>{let entries=data.sections[key]||[];let body=key==='skills'?`<div class="skills">${(entries[0]?.desc||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:entries.map(e=>`<div class="entry">${e.title?`<strong>${esc(e.title)}</strong>`:''}${e.meta?`<div class="meta">${esc(e.meta)}</div>`:''}${e.desc?`<p>${esc(e.desc)}</p>`:''}</div>`).join('');if(key==='experience'||key==='projects'||key==='education'||key==='skills'){if(key==='experience'||key==='projects'||key==='education'){} }return `<section class="resume-section"><h2>${titles[key]}</h2>${body}</section>`}).join('');renderOrder();renderEditors();}
function renderOrder(){ $('orderList').innerHTML=data.order.map(k=>`<span class="drag-chip" draggable="true" data-key="${k}">⠿ ${titles[k]}</span>`).join('');let dragged=null;$('orderList').querySelectorAll('.drag-chip').forEach(chip=>{chip.addEventListener('dragstart',()=>{dragged=chip.dataset.key;chip.classList.add('dragging')});chip.addEventListener('dragend',()=>chip.classList.remove('dragging'));chip.addEventListener('dragover',e=>e.preventDefault());chip.addEventListener('drop',e=>{e.preventDefault();let target=chip.dataset.key;if(!dragged||dragged===target)return;let a=data.order.indexOf(dragged),b=data.order.indexOf(target);data.order.splice(a,1);data.order.splice(b,0,dragged);render()})})}
function renderEditors(){ $('editors').innerHTML=data.order.map(k=>`<details class="section-editor" open><summary>${titles[k]} <span class="hint">(edit content)</span></summary><div id="edit-${k}"></div><button type="button" data-add="${k}">+ Add ${k==='skills'?'skills':'entry'}</button></details>`).join('');data.order.forEach(k=>{let host=$('edit-'+k);if(k==='skills'){let e=data.sections[k][0]||{desc:''};host.innerHTML=`<div class="field"><label>Skills (comma separated)</label><textarea data-k="${k}" data-i="0" data-f="desc">${esc(e.desc)}</textarea></div>`}else host.innerHTML=(data.sections[k]||[]).map((e,i)=>`<div class="section-editor"><div class="field"><label>Title</label><input data-k="${k}" data-i="${i}" data-f="title" value="${esc(e.title)}"></div><div class="field"><label>Organisation / dates / tools</label><input data-k="${k}" data-i="${i}" data-f="meta" value="${esc(e.meta)}"></div><div class="field"><label>Description</label><textarea data-k="${k}" data-i="${i}" data-f="desc">${esc(e.desc)}</textarea></div><button type="button" data-remove="${k}" data-i="${i}">Remove entry</button></div>`).join('')});$('editors').querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{let {k,i,f}=el.dataset;data.sections[k][+i][f]=el.value;renderPreviewOnly()}));$('editors').querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{let k=b.dataset.add;if(k==='skills')data.sections.skills=[{title:'',meta:'',desc:''}];else data.sections[k].push({title:'New entry',meta:'',desc:''});render()}));$('editors').querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{let k=b.dataset.remove;data.sections[k].splice(+b.dataset.i,1);render()}))}
function renderPreviewOnly(){ $('resumeSections').innerHTML=data.order.map(key=>{let es=data.sections[key]||[];let body=key==='skills'?`<div class="skills">${(es[0]?.desc||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:es.map(e=>`<div class="entry"><strong>${esc(e.title)}</strong><div class="meta">${esc(e.meta)}</div><p>${esc(e.desc)}</p></div>`).join('');return `<section class="resume-section"><h2>${titles[key]}</h2>${body}</section>`}).join('')}
fields.forEach(k=>$(k).addEventListener('input',()=>{data[k]=$(k).value;$('p-name').textContent=data.name||'Your Name';$('p-contact').textContent=[data.email,data.phone,data.location].filter(Boolean).join('  ·  ');$('p-links').textContent=data.links||'';$('p-summary').textContent=data.summary||''}));$('template').addEventListener('change',()=>{data.template=$('template').value;$('paper').className='paper template-'+data.template});
$('pdfBtn').addEventListener('click',()=>window.print());$('saveBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-resume-data.json';a.click();URL.revokeObjectURL(a.href);$('status').textContent='Resume data exported as JSON.'});$('loadFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let parsed=JSON.parse(await f.text());if(!parsed||typeof parsed!=='object'||!parsed.sections||!Array.isArray(parsed.order))throw Error('Invalid resume file');data={...structuredClone(defaultData),...parsed,sections:{...structuredClone(defaultData.sections),...parsed.sections}};data.order=data.order.filter(k=>titles[k]);render();$('status').textContent='Saved resume loaded successfully.'}catch(err){alert('Could not load this file. Please choose a JSON file exported by Resume Builder.')}e.target.value=''});
render();
</script></body></html>
